# Flyway configuration of csp-booking-db. The connection comes from the environment
# (FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD): no credential lives in this file.
[flyway]
# Flyway reads every folder of every family, recursively. The ORDER is not the
# folder: it is the version number in the file name (V001, V002, ...), one
# sequence for the whole repository. 05_rollbacks/ is NOT listed: Flyway never
# runs the U scripts by itself.
locations = ["filesystem:01_ddl", "filesystem:02_dml", "filesystem:03_dcl", "filesystem:04_tcl"]
# A file named outside V<version>__<description>.sql fails instead of being ignored.
validateMigrationNaming = true
# Reversion order: U scripts run from the highest version down, and U001 refuses to run (it drops the whole
# schema) while any later object still exists.
# clean drops everything. It is never needed: reversion is done with the U scripts.
cleanDisabled = true

# CREATE INDEX CONCURRENTLY waits for every open transaction to finish, and with
# the default transactional advisory lock Flyway keeps one open itself: the
# migration hangs for ever. With the lock outside a transaction, Flyway runs
# such a statement non-transactionally and records it.
[flyway.postgresql.transactional]
lock = false

# Own schema and own control table (Annex J.6): the history lives in
# booking.flyway_schema_history and never collides with another domain.
# These settings belong to the environment; the connection itself (url, user, password)
# is read from FLYWAY_URL, FLYWAY_USER and FLYWAY_PASSWORD.
[environments.default]
schemas = ["booking"]
defaultSchema = "booking"
